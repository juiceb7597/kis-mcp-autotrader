services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    env_file:
      - ./n8n/.env
    ports:
      - "5678:5678"
      - "5679:5679"  # 러너 통신용 포트 추가
    environment:
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_BROKER_PORT=5679
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=ragwire-token
      - N8N_RUNNERS_TASK_TIMEOUT=600
      # 환경 변수를 익스프레션에서 사용할 수 있도록 허용
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n

  task-runners:
    build: 
      context: ./n8n-runner/
      dockerfile: Dockerfile.runner
    container_name: n8n-runners
    restart: always
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=ragwire-token
      - N8N_RUNNERS_CONFIG_PATH=/etc/n8n-task-runners.json
      - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=debug
      - N8N_RUNNERS_TASK_TIMEOUT=600
    depends_on:
      - n8n
    volumes:
      - ./n8n-runner/config:/config

  kis-mcp:
    image: kis-trade-mcp:latest
    container_name: kis-mcp-server
    restart: always
    env_file:
      - ./MCP/.env
    ports:
      - "3000:3000" 

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333" # API 포트
      - "6334:6334" # gRPC 포트 (대량 데이터 처리용)
    volumes:
      - qdrant_data:/qdrant/storage 

volumes:
  n8n_data:
    external: true
  qdrant_data:
    external: true
