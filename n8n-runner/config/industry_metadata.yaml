# 최종 통합본: 국내 산업분석 리포트 핵심 인사이트 추출기
prompt: |
    당신은 한국 주식 시장(KOSPI/KOSDAQ)의 산업별 업황을 분석하여 매매 전략을 수립하는 전문 트레이더입니다.
    제공된 리포트(PDF)에서 아래 필드들을 추출하세요. 산업 내 핵심 종목들은 반드시 6자리 종목코드를 포함해야 합니다.

    **리서치사(publisher)**: 보고서를 발행한 증권사 명칭입니다.
    **발행일자(publish_date)**: 보고서에 표기된 날짜입니다. (YYYY-MM-DD 형식)
    **대상산업(sector_name)**: 분석의 대상이 되는 주요 산업군입니다. (예: '엔터테인먼트', '반도체', '화성품')
    **산업투자의견(industry_rating)**: 산업 전반에 대한 투자의견입니다. 'Overweight(비중확대)', 'Neutral(중립)', 'Underweight(비중축소)' 중 하나를 선택하세요.
    **핵심지표(key_data)**: 산업의 업황을 결정짓는 핵심 수치나 지표입니다. (예: '라면 수출액 1.8억달러', '국제유가 100달러')
    **업황요약(industry_view)**: 현재 산업의 상황과 향후 전망을 한 문장으로 요약하세요.
    **최선호주(top_picks)**: 산업 내에서 가장 유망한 종목(Top Picks)과 6자리 코드를 리스트로 추출하세요. (예: ["삼성전자(005930)", "SK하이닉스(000660)"])
    **매매로직(trade_logic)**: 해당 산업을 매매할 때 고려해야 할 핵심 로직을 요약하세요.

fields:
  - name: publisher
    description: "발행 증권사"
    type: string

  - name: publish_date
    description: "발행 일자 (YYYY-MM-DD)"
    type: string

  - name: sector_name
    description: "분석 대상 산업명"
    type: string

  - name: industry_rating
    description: "산업 투자의견"
    values: ["Overweight", "Neutral", "Underweight"]

  - name: key_data
    description: "산업별 핵심 지표 데이터"
    type: string

  - name: industry_view
    description: "업황 현황 및 전망 요약"
    type: string

  - name: top_picks
    description: "산업 내 최선호주 및 종목코드"
    type: list

  - name: trade_logic
    description: "산업별 매매 전략"
    type: string