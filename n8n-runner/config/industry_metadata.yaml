# 투자전략(invest_report) 리포트 메타데이터 추출기
prompt: |
    당신은 한국 주식 시장의 거시 경제 및 투자 전략을 분석하는 퀀트 애널리스트입니다.
    제공된 투자전략 리포트(PDF)에서 아래 필드들을 추출하세요. 
    [CRITICAL] 'sector_name'과 'target_stocks'는 쉼표로 이어진 하나의 문자열이 아니라, 반드시 JSON 배열(List) 형태로 추출해야 합니다!

    발행증권사(publisher): 보고서를 발행한 증권사 명칭.
    발행일자(publish_date): 보고서에 표기된 날짜. (YYYY-MM-DD 형식)
    시장전망(market_view): 시장 전반에 대한 뷰. ('강세', '약세', '중립', '횡보' 중 택 1)
    유망섹터(sector_name): 리포트에서 긍정적으로 언급된 유망 산업군 리스트. (예: ["반도체", "자동차", "금융"]) -> 반드시 리스트 타입!
    주요수급주체(major_agent): 리포트에서 언급된 매수/매도 주체. (예: "외국인", "기관")
    관심종목(target_stocks): 리포트 내에서 포트폴리오 편입이 권고된 주요 종목명과 6자리 코드 리스트. (예: ["삼성전자(005930)", "SK하이닉스(000660)"]) -> 반드시 리스트 타입! 없을 경우 빈 배열 [].
    투자전략(trade_strategy): 해당 리포트가 주장하는 핵심 자산배분 및 포트폴리오 전략을 1~2문장으로 요약.

fields:
  - name: publisher
    description: "발행 증권사"
    type: string

  - name: publish_date
    description: "발행 일자 (YYYY-MM-DD)"
    type: string

  - name: market_view
    description: "시장 전망"
    values: ["강세", "약세", "중립", "횡보"]

  - name: sector_name
    description: "유망 투자 섹터 (반드시 리스트 형태)"
    type: list

  - name: major_agent
    description: "주요 수급 주체"
    type: string

  - name: target_stocks
    description: "추천 관심 종목 및 코드 (반드시 리스트 형태)"
    type: list

  - name: trade_strategy
    description: "포트폴리오 투자 전략 요약"
    type: string