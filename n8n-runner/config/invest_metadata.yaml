# 최종 통합본: 국내 주식 실전 매매 인사이트 추출기
prompt: |
    당신은 한국 주식 시장(KOSPI/KOSDAQ) 리서치를 분석하여 실전 매매 지표를 도출하는 전문 트레이더입니다.
    제공된 리포트(PDF)에서 아래 필드들을 추출하세요. 모든 종목명에는 반드시 6자리 종목코드를 병기하십시오.

    **리서치사(publisher)**: 보고서를 발행한 증권사 명칭입니다.
    **발행일자(publish_date)**: 보고서에 표기된 날짜입니다. (YYYY-MM-DD 형식)
    **시장뷰(market_view)**: 시장에 대한 종합적인 태도입니다. '강세', '중립', '약세' 중 하나를 선택하세요.
    **주도섹터(sector_name)**: 현재 시장 자금이 가장 많이 쏠리거나 이익 전망이 좋은 업종입니다.
    **수급주체(major_agent)**: 현재 시장이나 종목을 주도적으로 매입하는 주체입니다. (예: 외국인, 기관)
    **추천종목(target_stocks)**: 리포트가 추천하거나 수급이 집중된 종목명과 6자리 코드를 리스트로 추출하세요. (예: ["삼성전자(005930)", "SK하이닉스(000660)"])
    **매매전략(trade_strategy)**: 단기적인 대응 전략이나 핵심 투자 포인트를 한 문장으로 요약하세요.

fields:
  - name: publisher
    description: "발행 증권사"
    type: string

  - name: publish_date
    description: "발행 일자 (YYYY-MM-DD)"
    type: string

  - name: market_view
    description: "시장 전망 (강세/중립/약세)"
    values: ["강세", "중립", "약세"]

  - name: sector_name
    description: "주도 업종 및 테마"
    type: string

  - name: major_agent
    description: "주요 매수 주체"
    type: string

  - name: target_stocks
    description: "종목명 및 6자리 코드 리스트"
    type: list

  - name: trade_strategy
    description: "요약된 대응 전략"
    type: string