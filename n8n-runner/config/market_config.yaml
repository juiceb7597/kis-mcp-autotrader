embeddings:
  provider: "google"
  model: "models/gemini-embedding-001" 
  api_key: "${GOOGLE_API_KEY}"

llm:
  provider: "google"
  model: "gemini-2.5-flash-lite"
  api_key: "${GOOGLE_API_KEY}"

vectorstore:
  url: "http://qdrant:6333"
  collection_name: "market_report"
  use_sparse: true
  force_recreate: false

retriever:
  search_type: "hybrid"
  top_k: 5
  auto_filter: true   # set true to enable LLM-based filter extraction from every query


metadata:
  config_file: "/config/economy_metadata.yaml"   # Custom fields (see Custom Metadata docs)
                                 # If omitted, defaults to: company_name,
                                 # doc_type, fiscal_quarter, fiscal_year
