# 최종 통합본: 국내외 주식 시황(Market) 분석 리포트 핵심 인사이트 추출기
prompt: |
    당신은 주식 시장의 당일/주간 시황을 분석하여 전반적인 시장의 흐름을 파악하고 투자 전략을 제시하는 전문 시황 애널리스트입니다.
    제공된 시황분석 리포트(PDF)에서 아래 필드들을 추출하세요.

    **리서치사(publisher)**: 보고서를 발행한 증권사 명칭입니다.
    **발행일자(publish_date)**: 보고서에 표기된 날짜입니다. (YYYY-MM-DD 형식)
    **시장상태(market_status)**: 리포트가 진단하는 현재 시장의 전반적인 분위기입니다. '강세', '약세', '횡보', '혼조' 중 하나를 선택하세요.
    **주요이슈(key_issue)**: 당일 또는 주간 시장의 상승/하락을 주도했거나 영향을 미친 가장 핵심적인 이슈나 요인을 요약하세요. (예: "미국 고용지표 호조", "중동 지정학적 리스크 부각")
    **수급동향(supply_demand)**: 주요 수급 주체(외국인, 기관, 개인)의 매수/매도 흐름을 요약하세요. (예: "외국인 코스피 대규모 순매도, 개인 저가 매수")
    **주도섹터(leading_sectors)**: 현재 시장에서 자금이 몰리거나 지수 방어 및 상승을 주도하고 있는 주요 업종(섹터)을 리스트 형태로 추출하세요. (예: ["반도체", "자동차", "조선"])
    **대응전략(market_strategy)**: 현재 시황에 따른 포트폴리오 관리 방안이나 단기/중장기 대응 전략을 한 문장으로 요약하세요.

fields:
  - name: publisher
    description: "발행 증권사"
    type: string

  - name: publish_date
    description: "발행 일자 (YYYY-MM-DD)"
    type: string

  - name: market_status
    description: "시장 전반적 분위기 및 흐름"
    values: ["강세", "약세", "횡보", "혼조"]

  - name: key_issue
    description: "시장을 주도한 핵심 동인 및 매크로/마이크로 이슈"
    type: string

  - name: supply_demand
    description: "외국인/기관/개인 수급 동향 요약"
    type: string

  - name: leading_sectors
    description: "주도 업종 및 테마 리스트"
    type: list

  - name: market_strategy
    description: "시황에 따른 투자 및 대응 전략"
    type: string